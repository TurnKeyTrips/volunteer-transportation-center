# Build and deploy the Hugo site to GitHub Pages on every push to main.
#
# Repo settings required: Settings → Pages → Source → "GitHub Actions".
name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel in-flight production deploys.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.162.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies (Tailwind CSS, Alpine.js, sharp)
        run: npm ci

      # Pages CMS validates file extension but NOT size, so an editor can commit a
      # full-resolution phone photo straight to main. Shrink any oversized JPEG in
      # the photo dirs to fit under the cap BEFORE the media check and the build,
      # so the deploy succeeds instead of failing. Fixes only the CI checkout (no
      # commit back); Hugo then generates its display sizes from the smaller file.
      - name: Auto-resize oversized editor photos
        run: node scripts/resize_media.mjs

      # Belt-and-suspenders behind the Pages CMS config and the resize step above:
      # enforce JPEG-only + 2 MB for photos and the PDF rules for flyers. After the
      # resize this passes on size, and it still catches non-JPEG/mislabeled files.
      - name: Check editor-uploaded media
        run: ./scripts/check_media.sh

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          # Google Calendar API key (read-only, referrer-restricted). Lives in the
          # repo secret GCAL_API_KEY, never in the repo itself.
          HUGO_VTC_GCAL_API_KEY: ${{ secrets.GCAL_API_KEY }}
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
